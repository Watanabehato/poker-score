<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102c25"><title>桌边 · 德州扑克计分</title>
<style>
:root{--bg:#f5f4ed;--ink:#193b30;--muted:#6e7e75;--green:#255844;--gold:#d6ac62}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,"Microsoft Yahei",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #d7ded6;border-radius:9px;background:white;color:var(--ink);padding:10px 15px}button:hover{background:#eaf0e7}button.primary{background:var(--green);color:white;border-color:var(--green)}input,select{border:1px solid #d7ded6;background:#fff;border-radius:8px;padding:10px;color:var(--ink);min-width:0}input:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}header{background:#102c25;color:#f9f7ed;padding:28px max(24px,calc((100vw - 1160px)/2));display:flex;align-items:center;justify-content:space-between}.brand{font-size:23px;font-weight:750;letter-spacing:2px}.brand span{color:var(--gold);margin-right:12px}.tag{color:#a9bdb0;font-size:12px;letter-spacing:2px}main{max-width:1160px;margin:auto;padding:36px 24px}h1{font-size:32px;margin:0 0 10px}h2{font-size:18px;margin:0}p{color:var(--muted);line-height:1.7}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.actions{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}.stat{background:white;border:1px solid #e3e6de;border-radius:14px;padding:20px}.stat label{display:block;color:var(--muted);font-size:13px}.stat strong{display:block;font-size:30px;margin-top:10px}.layout{display:grid;grid-template-columns:1fr 320px;gap:20px}.panel{background:white;border:1px solid #e3e6de;border-radius:16px;overflow:hidden}.panelhead{padding:20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #edf0e8}.settings{display:flex;gap:12px;flex-wrap:wrap;padding:18px 20px;background:#fafbf7}.settings label{font-size:12px;color:var(--muted);display:grid;gap:6px}.settings input{width:160px}.settings input[type=number]{width:110px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:13px 14px;background:#fafbf7}td{padding:15px 14px;border-bottom:1px solid #edf0e8}td input{width:92px;padding:8px}.avatar{display:inline-grid;place-items:center;width:28px;height:28px;background:#edf1e8;border-radius:50%;margin-right:8px;font-size:12px}.positive{color:#258057;font-weight:700}.negative{color:#bf5b50;font-weight:700}.add{display:flex;gap:10px;padding:20px}.add input{flex:1}.empty{text-align:center;padding:40px 20px;color:var(--muted)}.sidebody{padding:20px}.notice{padding:13px;background:#f6f1e6;border-radius:9px;color:#8b6930;font-size:13px;line-height:1.7}.ok{background:#edf6ee;color:#397751}.transfer{padding:15px 0;border-bottom:1px solid #edf0e8;display:flex;justify-content:space-between;gap:10px}.transfer small{display:block;color:var(--muted);margin-top:5px}.help{font-size:12px}.log{max-height:170px;overflow:auto;font-size:12px;color:var(--muted);line-height:1.8}.footer{display:flex;justify-content:space-between;gap:14px;margin:24px 0;font-size:12px;color:var(--muted)}dialog{border:0;border-radius:16px;padding:24px;width:min(440px,90vw);color:var(--ink)}dialog::backdrop{background:#102c2577}dialog form{display:grid;gap:15px}dialog label{display:grid;gap:6px}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#193b30;color:white;border-radius:10px;padding:12px 20px;display:none;z-index:20}@media(max-width:850px){.layout{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}@media(max-width:500px){main{padding:24px 14px}header{padding:22px 16px}.tag{display:none}h1{font-size:27px}.stats{gap:8px}.stat{padding:14px}.stat strong{font-size:24px}.settings{gap:8px}.settings input{width:140px}.footer{flex-direction:column}td,th{padding:12px 10px}}
</style></head><body>
<header><div class="brand"><span>♠</span>桌边</div><div class="tag">POKER NIGHT · EVERY CHIP COUNTS</div></header>
<main><div class="top"><div><h1>好好打牌，轻松记分。</h1><p>记录每一笔买入，算清每一场输赢。</p></div><div class="actions"><button id="export">导出备份</button><button id="import">导入备份</button><button id="new">＋ 新牌局</button></div></div>
<div class="stats"><div class="stat"><label>入座玩家</label><strong id="count">0</strong></div><div class="stat"><label>累计买入 · 筹码</label><strong id="total">0</strong></div><div class="stat"><label>筹码差额</label><strong id="diff">0</strong></div></div>
<div class="layout"><section class="panel"><div class="panelhead"><h2>♣ 牌局记分</h2><select id="sessions" aria-label="选择历史牌局"></select></div><div class="settings"><label>牌局名称<input id="title" maxlength="60"></label><label>默认买入筹码<input id="buyin" type="number" min="1" step="1"></label><label>计分方式<select id="mode"><option value="chips">筹码计分</option><option value="points">直接计分</option></select></label></div><div class="tablewrap"><table><thead id="thead"></thead><tbody id="players"></tbody></table></div><div id="empty" class="empty">牌桌还空着，添加第一位玩家吧。<br><small>买入与最终筹码均使用整数。</small></div><form class="add" id="add"><input id="name" placeholder="输入玩家昵称" aria-label="玩家昵称" maxlength="30" required><button class="primary">＋ 添加玩家</button></form></section>
<aside><section class="panel"><div class="panelhead"><h2>♦ 结算建议</h2><button id="copy">复制</button></div><div class="sidebody"><div id="notice" class="notice"></div><div id="settlement"></div><p class="help">筹码模式：净得分 = 最终筹码 − 累计买入。所有玩家得分合计为零后，生成转分建议。</p></div></section><section class="panel" style="margin-top:20px"><div class="panelhead"><h2>操作记录</h2><button id="undo">撤销</button></div><div id="log" class="sidebody log"></div></section></aside></div>
<div class="footer"><span id="saved">● 数据保存在当前浏览器</span><span>无需账号 · 支持离线 · 备份可在设备间迁移</span></div></main>
<dialog id="rebuy"><form id="rebuyform"><h2>记录增购</h2><label>增购筹码<input id="amount" type="number" min="1" step="1" required></label><div class="actions"><button type="button" id="cancel">取消</button><button class="primary">确认增购</button></div></form></dialog><input id="file" type="file" accept="application/json,.json" hidden><div id="toast" role="status"></div>
<script src="engine.js"></script><script src="app.js"></script></body></html>
